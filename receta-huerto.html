<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensalada de huerto</title>

    <style>
      body {
        background-color: #f3e8cc;
        font-family: Georgia, serif;
        color: #285637;
        padding: 30px;
      }

      .receta {
        max-width: 700px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 20px;
      }

      img {
        width: 100%;
        border-radius: 15px;
      }

      button {
        background-color: #285637;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 9px;
        cursor: pointer;
      }

      button:hover {
        background-color: gray;
      }
    </style>
  </head>

  <body>
    <div class="receta">
      <h1>Ensalada de huerto</h1>

      <img
        src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800"
        alt="Ensalada de huerto"
      />

      <h2>Ingredientes</h2>

      <ul>
        <li>Lechuga</li>
        <li>Tomate</li>
        <li>Zanahoria</li>
        <li>Pepino</li>
        <li>Sal y limón</li>
      </ul>

      <h2>Preparación</h2>

      <p>
        Lavar, cortar y mezclar todos los ingredientes. Agregar sal y limón al
        gusto.
      </p>

      <button onclick="window.location.href = 'main.html#recetas'">
        Volver
      </button>
    </div>
  </body>
</html>
