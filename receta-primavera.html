<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensalada Primavera</title>

    <style>
      body {
        background-color: #f3e8cc;
        font-family: Georgia, serif;
        color: #285637;
        padding: 30px;
      }

      .receta {
        max-width: 700px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 20px;
      }

      img {
        width: 100%;
        border-radius: 15px;
      }

      button {
        background-color: #285637;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 9px;
        cursor: pointer;
      }

      button:hover {
        background-color: gray;
      }
    </style>
  </head>

  <body>
    <div class="receta">
      <h1>Ensalada Primavera</h1>

      <img
        src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=800"
        alt="Ensalada Primavera"
      />

      <h2>Ingredientes</h2>

      <ul>
        <li>Lechuga</li>
        <li>Aguacate</li>
        <li>Tomate</li>
        <li>Zanahoria</li>
        <li>Repollo</li>
        <li>Aceite de oliva</li>
      </ul>

      <h2>Preparación</h2>

      <p>
        Cortar las verduras, mezclarlas en un recipiente y agregar aceite de
        oliva al gusto.
      </p>

      <button onclick="window.location.href = 'main.html#recetas'">
        Volver
      </button>
    </div>
  </body>
</html>
