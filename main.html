<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rakinakuy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #F3E8CC;
      font-family: Arial, sans-serif;
    }

    .site-header {
      width: 100%;
      height: 142px;
      background-color: #19532B;
      display: flex;
      align-items: center;
    }

    .site-header__logo {
      width: min(336px, 100%);
      margin-left: 36px;
      flex-shrink: 0;
    }

    .site-header__logo svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .site-header__nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      margin-right: 36px;
    }

    .site-header__link {
      display: inline-block;
      padding: 12px 18px;
      border: none;
      border-radius: 0;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      background: transparent;
      transition: opacity 0.2s;
    }

    .site-header__link:hover,
    .site-header__link:focus-visible {
      opacity: 0.8;
    }

    @media (max-width: 850px) {
      .site-header {
        height: auto;
        min-height: 142px;
        flex-direction: column;
        justify-content: center;
        padding: 20px;
        gap: 20px;
      }

      .site-header__logo {
        margin-left: 0;
      }

      .site-header__nav {
        margin: 0;
        justify-content: center;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 480px) {
      .site-header__logo {
        width: min(260px, calc(100% - 40px));
      }

      .site-header__nav {
        gap: 8px;
      }

      .site-header__link {
        padding: 10px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
