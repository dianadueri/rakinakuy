
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakinakuy - Registro</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background-color: #F3E8CC;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .avatar-container {
            text-align: center;
        }

        .avatar-upload {
            width: 150px;
            height: 150px;
            border: 2px dashed #777;
            border-radius: 50%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: border-color 0.3s;
        }

        .avatar-upload:hover {
            border-color: #333;
        }

        .upload-icon {
            width: 42px;
            height: 42px;
            color: #555;
        }

        .avatar-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #avatar-input {
            display: none;
        }

        .avatar-text {
            margin-top: 12px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="avatar-container">

        <label for="avatar-input" class="avatar-upload"
               aria-label="Seleccionar foto de perfil">

            <svg class="upload-icon" id="upload-icon"
                 xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M12 16V4"/>
                <path d="m7 9 5-5 5 5"/>
                <path d="M20 16.5v3a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19.5v-3"/>
            </svg>

            <img id="avatar-preview"
                 class="avatar-preview"
                 alt="Vista previa de la foto de perfil">

        </label>

        <input
            type="file"
            id="avatar-input"
            accept="image/*"
        >

        <p class="avatar-text">Selecciona tu foto de perfil</p>

    </div>

    <script>
        const avatarInput = document.getElementById("avatar-input");
        const avatarPreview = document.getElementById("avatar-preview");
        const uploadIcon = document.getElementById("upload-icon");

        avatarInput.addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("Por favor, selecciona una imagen válida.");
                return;
            }

            const imageURL = URL.createObjectURL(file);

            avatarPreview.src = imageURL;
            avatarPreview.style.display = "block";
            uploadIcon.style.display = "none";
        });
    </script>

</body>
</html>
