<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakinakuy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7efcf;
            color: #194d2d;
        }

        header {
            background: #14532d;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-derecha {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-navbar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #c4d600;
            cursor: pointer;
        }

        .boton-sesion {
            background: #c4d600;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        main {
            padding: 45px 8%;
        }

        .titulo-seccion {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo-seccion h1 {
            font-size: 32px;
            color: #27643b;
            margin-bottom: 10px;
        }

        .recetas-extra {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .tarjeta-receta {
            width: 280px;
            height: 200px;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            background: #ddd;
        }

        .tarjeta-receta img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .texto-receta {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, 0.75)
            );
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 20px;
            color: white;
        }

        .texto-receta h3 {
            font-size: 21px;
            margin-bottom: 12px;
        }

        .boton-receta {
            background: white;
            color: #14532d;
            border: none;
            padding: 9px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-receta:hover {
            background: #c4d600;
        }

        .ver-mas {
            display: block;
            margin: 25px auto;
            background: #14532d;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .contenedor-registro {
            margin: 70px auto;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .contenedor-registro h2 {
            margin-bottom: 25px;
            color: #14532d;
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            position: relative;
        }

        .avatar-preview {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #14532d;
            background: white;
        }

        .avatar-upload {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: #14532d;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            cursor: pointer;
        }

        .contenedor-registro input[type="text"],
        .contenedor-registro input[type="email"],
        .contenedor-registro input[type="password"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .boton-principal {
            width: 100%;
            padding: 13px;
            background: #14532d;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-principal:hover {
            background: #27643b;
        }

        .mensaje {
            margin-top: 15px;
            color: #14532d;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-contenido {
            background: #f7efcf;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .modal-contenido h2 {
            margin-bottom: 15px;
            color: #14532d;
        }

        .cerrar-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        footer {
            background: #14532d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        @media (max-width: 650px) {
            header {
                flex-wrap: wrap;
                gap: 15px;
            }

            nav {
                gap: 12px;
                flex-wrap: wrap;
            }

            main {
                padding: 35px 5%;
            }

            .tarjeta-receta {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVEGACIÓN -->
    <header>

        <div class="logo">RAKINAKUY</div>

        <nav>
            <a href="#inicio">INICIO</a>
            <a href="#recetas">RECETAS</a>
            <a href="#registro">REGISTRO</a>
        </nav>

        <div class="nav-derecha">

            <img
                id="avatarNavbar"
                class="avatar-navbar"
                src="images/avatar-default.png"
                alt="Avatar del usuario"
                title="Mi perfil"
            >

            <button
                class="boton-sesion"
                id="botonSesion"
                type="button"
                onclick="cerrarSesion()"
            >
                Iniciar sesión
            </button>

        </div>

    </header>


    <!-- INICIO -->
    <main id="inicio">

        <!-- RECETAS DESTACADAS -->
        <section id="recetas">

            <div class="titulo-seccion">
                <h1>Encuentra Recetas</h1>
                <p>Descubre nuevas recetas para compartir.</p>
            </div>

            <div class="recetas-extra" id="recetasExtra">

                <!-- ENSALADA DE HUERTO -->
                <article class="tarjeta-receta">

                    <img
                        src="images/ensalada1.png"
                        alt="Ensalada de huerto"
                    >

                    <div class="texto-receta">

                        <h3>Ensalada de huerto</h3>

                        <button
                            class="boton-receta"
                            type="button"
                            data-receta="ensalada-huerto"
                        >
                            Ver receta
                        </button>

                    </div>

                </article>


                <!-- ENSALADA PRIMAVERA -->
                <article class="tarjeta-receta">

                    <img
                        src="images/ensalada2.png"
                        alt="Ensalada Primavera"
                    >

                    <div class="texto-receta">

                        <h3>Ensalada Primavera</h3>

                        <button
                            class="boton-receta"
                            type="button"
                            data-receta="ensalada-primavera"
                        >
                            Ver receta
                        </button>

                    </div>

                </article>

            </div>

            <button class="ver-mas" type="button">
                Ver más Recetas
            </button>

        </section>


        <!-- REGISTRO Y CARGA DE AVATAR -->
        <section id="registro">

            <div class="contenedor-registro">

                <h2>Mi perfil</h2>

                <!-- AVATAR -->
                <div class="avatar-container">

                    <img
                        id="avatarPreview"
                        class="avatar-preview"
                        src="images/avatar-default.png"
                        alt="Foto de perfil"
                    >

                    <label
                        for="avatarInput"
                        class="avatar-upload"
                        title="Subir fotografía"
                    >
                        ↑
                    </label>

                </div>

                <input
                    type="file"
                    id="avatarInput"
                    accept="image/*"
                    hidden
                >

                <p>Selecciona una fotografía para tu perfil.</p>

                <br>

                <!-- DATOS DEL USUARIO -->
                <form id="formRegistro">

                    <input
                        type="text"
                        id="nombreUsuario"
                        placeholder="Nombre completo"
                        required
                    >

                    <input
                        type="email"
                        id="correoUsuario"
                        placeholder="Correo electrónico"
                        required
                    >

                    <input
                        type="password"
                        id="passwordUsuario"
                        placeholder="Contraseña"
                        required
                    >

                    <button
                        type="submit"
                        class="boton-principal"
                    >
                        Crear cuenta
                    </button>

                </form>

                <p id="mensajeRegistro" class="mensaje"></p>

            </div>

        </section>

    </main>


    <!-- MODAL DE RECETAS -->
    <div class="modal" id="modalReceta">

        <div class="modal-contenido">

            <button
                class="cerrar-modal"
                type="button"
                id="cerrarModal"
            >
                ×
            </button>

            <h2 id="tituloModal"></h2>

            <p id="descripcionModal"></p>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>RAKINAKUY © 2026 - Compartiendo sabores y comunidad.</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script>

        // CARGAR INFORMACIÓN GUARDADA
        document.addEventListener("DOMContentLoaded", function() {

            const avatarGuardado =
                localStorage.getItem("avatarUsuario");

            const usuarioGuardado =
                localStorage.getItem("usuarioRakinakuy");

            const sesionActiva =
                localStorage.getItem("sesionActiva");

            if (avatarGuardado) {
                document.getElementById("avatarPreview").src =
                    avatarGuardado;

                document.getElementById("avatarNavbar").src =
                    avatarGuardado;
            }

            if (usuarioGuardado && sesionActiva === "true") {
                document.getElementById("botonSesion").textContent =
                    "Cerrar sesión";
            }

        });


        // CARGA DE AVATAR
        const avatarInput =
            document.getElementById("avatarInput");

        avatarInput.addEventListener("change", function() {

            const archivo = this.files[0];

            if (!archivo) return;

            if (!archivo.type.startsWith("image/")) {
                alert("Selecciona una imagen válida.");
                this.value = "";
                return;
            }

            const lector = new FileReader();

            lector.onload = function(evento) {

                const imagen = evento.target.result;

                localStorage.setItem("avatarUsuario", imagen);

                document.getElementById("avatarPreview").src =
                    imagen;

                document.getElementById("avatarNavbar").src =
                    imagen;

            };

            lector.readAsDataURL(archivo);

        });


        // REGISTRO DEL USUARIO
        document.getElementById("formRegistro")
        .addEventListener("submit", function(evento) {

            evento.preventDefault();

            const nombre =
                document.getElementById("nombreUsuario").value;

            const correo =
                document.getElementById("correoUsuario").value;

            localStorage.setItem("usuarioRakinakuy", JSON.stringify({
                nombre: nombre,
                correo: correo
            }));

            localStorage.setItem("sesionActiva", "true");

            document.getElementById("botonSesion").textContent =
                "Cerrar sesión";

            document.getElementById("mensajeRegistro").textContent =
                "¡Bienvenido/a a Rakinakuy, " + nombre + "!";

        });


        // CERRAR SESIÓN
        function cerrarSesion() {

            const sesionActiva =
                localStorage.getItem("sesionActiva");

            if (sesionActiva === "true") {

                localStorage.setItem("sesionActiva", "false");

                document.getElementById("botonSesion").textContent =
                    "Iniciar sesión";

                document.getElementById("mensajeRegistro").textContent =
                    "Has cerrado tu sesión.";

            } else {

                document.getElementById("registro").scrollIntoView({
                    behavior: "smooth"
                });

            }

        }


        // RECETAS
        const recetas = {

            "ensalada-huerto": {
                titulo: "Ensalada de huerto",
                descripcion:
                    "Una ensalada fresca preparada con ingredientes naturales del huerto."
            },

            "ensalada-primavera": {
                titulo: "Ensalada Primavera",
                descripcion:
                    "Una combinación colorida de vegetales frescos y saludables."
            }

        };


        // ABRIR RECETA
        document.querySelectorAll(".boton-receta")
        .forEach(function(boton) {

            boton.addEventListener("click", function() {

                const recetaSeleccionada =
                    this.dataset.receta;

                const receta = recetas[recetaSeleccionada];

                document.getElementById("tituloModal").textContent =
                    receta.titulo;

                document.getElementById("descripcionModal").textContent =
                    receta.descripcion;

                document.getElementById("modalReceta").style.display =
                    "flex";

            });

        });


        // CERRAR MODAL
        document.getElementById("cerrarModal")
        .addEventListener("click", function() {

            document.getElementById("modalReceta").style.display =
                "none";

        });

        document.getElementById("modalReceta")
        .addEventListener("click", function(evento) {

            if (evento.target === this) {
                this.style.display = "none";
            }

        });

    </script>

</body>
</html>
