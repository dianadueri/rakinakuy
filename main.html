<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa — Cochabamba</title>
  <style>
    :root {
      --cream: #f3e9cd;
      --green: #477653;
      --green-dark: #14552f;
      --field: #fff;
      --text: #284b35;
      --focus: #8aaa79;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--cream);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    body:has(.profile-form:not([hidden])) {
      padding: clamp(24px, 6vw, 64px) 20px;
    }

    .profile-form {
      width: min(100%, 560px);
    }

    .field-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--green);
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 700;
      line-height: 1.2;
    }

    input {
      display: block;
      width: 100%;
      min-height: 47px;
      padding: 9px 16px;
      border: 2px solid var(--green-dark);
      border-radius: 11px;
      outline: none;
      background: var(--field);
      color: var(--green);
      font: 700 1.2rem/1.25 Arial, Helvetica, sans-serif;
      text-align: center;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    input:hover {
      border-color: var(--green);
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgb(71 118 83 / 17%);
    }

    input[aria-invalid="true"] {
      border-color: #b64a3d;
      background: #fffafa;
    }

    .message {
      min-height: 1.2em;
      margin: 6px 2px 0;
      color: #a33c32;
      font: 500 .85rem/1.3 Arial, Helvetica, sans-serif;
    }

    .status {
      margin-top: 4px;
      color: var(--green-dark);
      font: 500 .9rem/1.4 Arial, Helvetica, sans-serif;
    }

    /* Campo de contraseña */
    input[type="password"] {
      letter-spacing: 3px;
    }

    /* Mensaje de contraseña válido */
    .message.success {
      color: #24733c;
    }

    /* Mensaje de contraseña incorrecto */
    .message.error {
      color: #b42318;
    }

    /* Botón de iniciar sesión */
    .login-button {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      background-color: #477653;
      color: white;
      border: 2px solid #14552f;
      border-radius: 11px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* Cambiar de verde a gris al pasar el cursor */
    .login-button:hover {
      background-color: #858585;
      border-color: #858585;
    }

    /* Estado de carga */
    .login-button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    /* --- SECCIÓN MAPA ESTILO CAPTURA --- */
    .map-page[hidden] {
      display: none;
    }

    .map-page:not([hidden]) {
      display: block;
      width: 100%;
      padding-bottom: 40px;
    }

    .map-section-title {
      margin: 0;
      padding: 14px 16px 12px;
      color: var(--green);
      font-size: clamp(1.8rem, 4.2vw, 2.5rem);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      background: var(--cream);
    }

    .map-banner {
      position: relative;
      width: 100%;
      min-height: clamp(230px, 34vw, 340px);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: clamp(18px, 3.5vw, 32px) clamp(20px, 6vw, 80px);
      background-color: #d8c7a3;
      background-image:
        linear-gradient(
          to top,
          rgba(243, 233, 205, 0.72) 0%,
          rgba(243, 233, 205, 0.12) 48%,
          rgba(0, 0, 0, 0) 100%
        ),
        url(/rakinakuy/imagen-mercado.png);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .map-banner-text {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0;
      color: #2f6b3b;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 3.1vw, 2.05rem);
      font-weight: 700;
      line-height: 1.18;
      text-align: left;
      text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0 2px 6px rgba(255, 255, 255, 0.9);
    }

    .map-action-button {
      display: block;
      width: min(86%, 340px);
      margin: 28px auto 0;
      padding: 12px 24px;
      background-color: #265c36;
      color: #ffffff;
      border: 1px solid #1b4427;
      border-radius: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .map-action-button:hover {
      background-color: #1b4427;
    }

    @media (max-width: 480px) {
      .profile-form { padding: 28px 18px; }
      .field-group { margin-bottom: 19px; }
      input {
        min-height: 46px;
        font-size: 1.05rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="profile-form" id="loginContainer">
    <form id="userForm" autocomplete="on" novalidate>
      <div class="field-group">
        <label for="username">Nombre de usuario:</label>
        <input
          type="text"
          id="username"
          name="username"
          value="GreenDrew"
          placeholder="Escribe tu nombre de usuario"
          autocomplete="username"
          minlength="3"
          maxlength="20"
          required
          aria-describedby="usernameMessage"
        >
        <p class="message" id="usernameMessage" aria-live="polite"></p>
      </div>

      <div class="field-group">
        <label for="fullName">Nombre y Apellidos</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          value="Andrew Valdivia"
          placeholder="Escribe tu nombre y apellidos"
          autocomplete="name"
          maxlength="60"
          required
          aria-describedby="fullNameMessage"
        >
        <p class="message" id="fullNameMessage" aria-live="polite"></p>
      </div>

      <!-- Campo de contraseña -->
      <div class="field-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Escribe tu contraseña"
          autocomplete="current-password"
          required
          aria-describedby="passwordMessage"
        >
        <p class="message" id="passwordMessage" aria-live="polite">
          La contraseña debe tener al menos 8 caracteres, un número y un carácter especial.
        </p>
      </div>

      <p class="status" id="formStatus" role="status" aria-live="polite"></p>

      <!-- Botón de inicio de sesión -->
      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Iniciar sesión
      </button>
    </form>
  </main>

  <!-- Sección visible tras iniciar sesión exitosamente -->
  <section class="map-page" id="mapSection" aria-labelledby="mapTitle" hidden>
    <h1 class="map-section-title" id="mapTitle">Mapa</h1>

    <div class="map-banner" role="img" aria-label="Mercado o feria de alimentos en Cochabamba">
      <p class="map-banner-text">
        Encuentra ferias y negocios en la ciudad de Cochabamba
      </p>
    </div>

    <button type="button" class="map-action-button" id="openMapButton">
      Revisar Mapa
    </button>
  </section>

  <script>
    const form = document.getElementById("userForm");
    const loginContainer = document.getElementById("loginContainer");
    const mapSection = document.getElementById("mapSection");
    const openMapButton = document.getElementById("openMapButton");

    const passwordInput = document.getElementById("password");
    const passwordMessage = document.getElementById("passwordMessage");
    const loginButton = document.getElementById("loginButton");
    const formStatus = document.getElementById("formStatus");

    // Campos del formulario
    const fields = [
      {
        input: document.getElementById("username"),
        message: document.getElementById("usernameMessage"),

        validate(value) {
          if (!value.trim()) {
            return "El nombre de usuario es obligatorio.";
          }

          if (value.trim().length < 3) {
            return "Debe tener al menos 3 caracteres.";
          }

          if (!/^[a-zA-Z0-9_.-]+$/.test(value.trim())) {
            return "Usa solo letras, números, puntos y guiones.";
          }

          return "";
        }
      },

      {
        input: document.getElementById("fullName"),
        message: document.getElementById("fullNameMessage"),

        validate(value) {
          if (!value.trim()) {
            return "El nombre y los apellidos son obligatorios.";
          }

          if (value.trim().length < 5) {
            return "Introduce un nombre más completo.";
          }

          return "";
        }
      }
    ];

    // Validar nombre de usuario y nombre completo
    function validateField(field) {
      const error = field.validate(field.input.value);

      field.message.textContent = error;

      field.input.setAttribute(
        "aria-invalid",
        String(Boolean(error))
      );

      return !error;
    }

    // VALIDACIÓN DE CONTRASEÑA
    function validatePassword() {
      const password = passwordInput.value;

      // Comprobar los requisitos
      const hasLength = password.length >= 8;
      const hasNumber = /\d/.test(password);
      const hasSpecial = /[^A-Za-z0-9]/.test(password);

      const isValid = hasLength && hasNumber && hasSpecial;

      if (isValid) {
        passwordMessage.textContent =
          "¡Contraseña válida! Cumple todos los requisitos.";

        passwordMessage.classList.remove("error");
        passwordMessage.classList.add("success");

        passwordInput.setAttribute("aria-invalid", "false");
      } else {
        const errors = [];

        if (!hasLength) {
          errors.push("mínimo 8 caracteres");
        }

        if (!hasNumber) {
          errors.push("un número");
        }

        if (!hasSpecial) {
          errors.push("un carácter especial");
        }

        passwordMessage.textContent =
          "Contraseña incorrecta: falta " + errors.join(", ") + ".";

        passwordMessage.classList.remove("success");
        passwordMessage.classList.add("error");

        passwordInput.setAttribute("aria-invalid", "true");
      }

      return isValid;
    }

    // Validación automática de los campos
    fields.forEach((field) => {
      field.input.addEventListener("input", () => {
        validateField(field);
        formStatus.textContent = "";
      });

      field.input.addEventListener("blur", () => {
        validateField(field);
      });
    });

    // Validar contraseña mientras se escribe
    passwordInput.addEventListener("input", () => {
      validatePassword();
      formStatus.textContent = "";
    });

    passwordInput.addEventListener("blur", validatePassword);

    // INICIO DE SESIÓN
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      // Comprobar todos los campos
      const fieldsValid = fields
        .map(validateField)
        .every(Boolean);

      const passwordValid = validatePassword();

      // Si algún campo es incorrecto
      if (!fieldsValid || !passwordValid) {
        alert("Credenciales inválidas. Revisa tus datos.");

        formStatus.textContent =
          "No se pudo iniciar sesión. Comprueba tus datos.";

        return;
      }

      // Mostrar estado de carga
      loginButton.disabled = true;
      loginButton.textContent = "Iniciando sesión...";
      formStatus.textContent = "Comprobando credenciales...";

      // Simular inicio de sesión exitoso y mostrar la sección Mapa
      setTimeout(() => {
        loginContainer.hidden = true;
        mapSection.hidden = false;
      }, 1200);
    });

    // Acción del botón "Revisar Mapa"
    openMapButton.addEventListener("click", () => {
      alert("Abriendo mapa de ferias y negocios en Cochabamba...");
    });
  </script>
</body>
</html>
