<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granja Ramírez</title>
  <style>
    /* ======= ESTILOS BASE ======= */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5efdc;
      color: #2e2e2e;
      min-height: 100vh;
    }

    /* ======= NAVBAR ======= */
    .navbar {
      background: #2f6b3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
    }

    .navbar__logo { color: #fff; font-weight: bold; font-size: 18px; }

    .navbar__acciones { display: flex; align-items: center; gap: 12px; }

    .navbar__carrito {
      background: #cfe3b8;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .navbar__perfil {
      width: 36px; height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: #cfe3b8;
      cursor: pointer;
    }

    /* Selector de idioma: verde -> gris al pasar el mouse */
    .navbar__idioma {
      background: #cfe3b8;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .navbar__idioma:hover { background: #9a9a9a; color: #fff; }

    /* ======= CONTENEDOR DE PANTALLAS ======= */
    .pantalla { display: none; }
    .pantalla--activa { display: block; }

    /* ======= LOGIN / REGISTRO ======= */
    .caja-form {
      background: #f5efdc;
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .caja-form h2 {
      font-size: 22px;
      color: #2f6b3a;
      margin-bottom: 24px;
      text-align: center;
    }

    .campo {
      width: 100%;
      max-width: 320px;
      margin-bottom: 14px;
    }

    .campo label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #2f6b3a;
      margin-bottom: 4px;
    }

    .campo input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #2f6b3a;
      border-radius: 4px;
      font-size: 14px;
      background: #fff;
    }

    .campo input:focus { outline: 2px solid #2f6b3a; }

    .btn-principal {
      width: 100%;
      max-width: 320px;
      background: #2f6b3a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-principal:hover { background: #24552e; }

    .enlace-cambio {
      margin-top: 16px;
      font-size: 13px;
      color: #2f6b3a;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
    }

    /* ======= FOTO DE PERFIL ======= */
    .zona-foto {
      width: 160px; height: 160px;
      border: 2px dashed #8a8a8a;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 12px;
      background: #fffdf5;
      overflow: hidden;
    }

    .zona-foto__icono { font-size: 28px; color: #555; }

    .zona-foto img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
    }

    .texto-foto { font-size: 12px; color: #555; margin-bottom: 24px; }

    /* ======= PRODUCTOS ======= */
    .productos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px;
      justify-content: center;
    }

    .tarjeta {
      background: #fffdf5;
      border-radius: 12px;
      padding: 14px;
      width: 180px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .tarjeta__img {
      width: 100%; height: 90px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .tarjeta__nombre { font-size: 16px; margin-bottom: 4px; }

    .tarjeta__granja {
      font-size: 10px;
      color: #fff;
      background: #2f6b3a;
      border-radius: 4px;
      display: inline-block;
      padding: 2px 6px;
      margin-bottom: 6px;
    }

    .tarjeta__precio { font-size: 13px; margin-bottom: 10px; }

    .tarjeta__acciones {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* ======= SELECTOR DE CANTIDAD ======= */
    .cantidad {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e8e2cc;
      border-radius: 20px;
      padding: 3px 6px;
    }

    .cantidad__btn {
      border: none;
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      width: 18px;
    }

    .cantidad__valor { font-size: 13px; min-width: 14px; text-align: center; }

    /* ======= BOTÓN COMPRAR ======= */
    .btn-comprar {
      background: #2f6b3a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-comprar:hover { background: #24552e; }

    /* ======= AVISO DE CONFIRMACIÓN ======= */
    .aviso {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2f6b3a;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
    }

    .aviso--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ======= BARRA DE NAVEGACIÓN ======= -->
  <header class="navbar">
    <div class="navbar__logo">Granja Ramírez</div>
    <div class="navbar__acciones">
      <button class="navbar__carrito" id="btnCarrito">
        🛒 <span id="contadorCarrito">0</span>
      </button>
      <img src="" alt="Perfil" class="navbar__perfil" id="fotoNavbar">
      <button class="navbar__idioma" id="btnIdioma">🌐 ESPAÑOL</button>
    </div>
  </header>

  <!-- ======= PANTALLA: LOGIN ======= -->
  <section class="pantalla pantalla--activa" id="pantallaLogin">
    <div class="caja-form">
      <h2>Iniciar sesión</h2>

      <div class="campo">
        <label for="loginUsuario">Nombre de usuario:</label>
        <input type="text" id="loginUsuario" placeholder="Tu usuario">
      </div>

      <div class="campo">
        <label for="loginContrasena">Contraseña:</label>
        <input type="password" id="loginContrasena" placeholder="Tu contraseña">
      </div>

      <button class="btn-principal" id="btnLogin">Iniciar sesión</button>

      <button class="enlace-cambio" id="irARegistro">¿No tienes cuenta? Regístrate</button>
    </div>
  </section>

  <!-- ======= PANTALLA: REGISTRO ======= -->
  <section class="pantalla" id="pantallaRegistro">
    <div class="caja-form">
      <h2>Crear cuenta</h2>

      <div class="campo">
        <label for="regUsuario">Nombre de usuario:</label>
        <input type="text" id="regUsuario" placeholder="Elige un usuario">
      </div>

      <div class="campo">
        <label for="regContrasena">Contraseña:</label>
        <input type="password" id="regContrasena" placeholder="Elige una contraseña">
      </div>

      <button class="btn-principal" id="btnRegistro">Registrarme</button>

      <button class="enlace-cambio" id="irALogin">Ya tengo cuenta, iniciar sesión</button>
    </div>
  </section>

  <!-- ======= PANTALLA: FOTO DE PERFIL ======= -->
  <section class="pantalla" id="pantallaFoto">
    <div class="caja-form">
      <h2>Tu foto de perfil</h2>

      <div class="zona-foto" id="zonaFoto">
        <span class="zona-foto__icono" id="iconoFoto">⬆</span>
        <img src="" alt="Foto de perfil" id="previewFoto">
      </div>
      <p class="texto-foto">Selecciona tu foto de perfil</p>

      <input type="file" id="inputFoto" accept="image/*" hidden>

      <button class="btn-principal" id="btnContinuar">Continuar</button>
    </div>
  </section>

  <!-- ======= PANTALLA: INICIO / PRODUCTOS ======= -->
  <section class="pantalla" id="pantallaInicio">
    <main class="productos">

      <div class="tarjeta" data-id="1" data-nombre="Manzana" data-precio="4">
        <img src="manzana.jpg" alt="Manzana" class="tarjeta__img">
        <h3 class="tarjeta__nombre">Manzana</h3>
        <p class="tarjeta__granja">GRANJA RAMÍREZ</p>
        <p class="tarjeta__precio">4 Bs</p>
        <div class="tarjeta__acciones">
          <div class="cantidad">
            <button class="cantidad__btn cantidad__menos">−</button>
            <span class="cantidad__valor">0</span>
            <button class="cantidad__btn cantidad__mas">+</button>
          </div>
          <button class="btn-comprar">Comprar</button>
        </div>
      </div>

      <div class="tarjeta" data-id="2" data-nombre="Banana" data-precio="4">
        <img src="banana.jpg" alt="Banana" class="tarjeta__img">
        <h3 class="tarjeta__nombre">Banana</h3>
        <p class="tarjeta__granja">GRANJA RAMÍREZ</p>
        <p class="tarjeta__precio">4 Bs</p>
        <div class="tarjeta__acciones">
          <div class="cantidad">
            <button class="cantidad__btn cantidad__menos">−</button>
            <span class="cantidad__valor">0</span>
            <button class="cantidad__btn cantidad__mas">+</button>
          </div>
          <button class="btn-comprar">Comprar</button>
        </div>
      </div>

      <div class="tarjeta" data-id="3" data-nombre="Naranja" data-precio="4">
        <img src="naranja.jpg" alt="Naranja" class="tarjeta__img">
        <h3 class="tarjeta__nombre">Naranja</h3>
        <p class="tarjeta__granja">GRANJA RAMÍREZ</p>
        <p class="tarjeta__precio">4 Bs</p>
        <div class="tarjeta__acciones">
          <div class="cantidad">
            <button class="cantidad__btn cantidad__menos">−</button>
            <span class="cantidad__valor">0</span>
            <button class="cantidad__btn cantidad__mas">+</button>
          </div>
          <button class="btn-comprar">Comprar</button>
        </div>
      </div>

      <div class="tarjeta" data-id="4" data-nombre="Limón" data-precio="4">
        <img src="limon.jpg" alt="Limón" class="tarjeta__img">
        <h3 class="tarjeta__nombre">Limón</h3>
        <p class="tarjeta__granja">GRANJA RAMÍREZ</p>
        <p class="tarjeta__precio">4 Bs</p>
        <div class="tarjeta__acciones">
          <div class="cantidad">
            <button class="cantidad__btn cantidad__menos">−</button>
            <span class="cantidad__valor">0</span>
            <button class="cantidad__btn cantidad__mas">+</button>
          </div>
          <button class="btn-comprar">Comprar</button>
        </div>
      </div>

    </main>
  </section>

  <!-- ======= AVISO DE CONFIRMACIÓN ======= -->
  <div class="aviso" id="aviso"></div>

  <script>
    // ==================== NAVEGACIÓN ENTRE PANTALLAS ====================
    const pantallas = {
      login: document.getElementById('pantallaLogin'),
      registro: document.getElementById('pantallaRegistro'),
      foto: document.getElementById('pantallaFoto'),
      inicio: document.getElementById('pantallaInicio')
    };

    function mostrarPantalla(nombre) {
      Object.values(pantallas).forEach(p => p.classList.remove('pantalla--activa'));
      pantallas[nombre].classList.add('pantalla--activa');
    }

    document.getElementById('irARegistro').addEventListener('click', () => mostrarPantalla('registro'));
    document.getElementById('irALogin').addEventListener('click', () => mostrarPantalla('login'));

    // ==================== LOGIN ====================
    document.getElementById('btnLogin').addEventListener('click', () => {
      const usuario = document.getElementById('loginUsuario').value.trim();
      const contrasena = document.getElementById('loginContrasena').value.trim();

      if (!usuario || !contrasena) {
        mostrarAviso('Completa usuario y contraseña');
        return;
      }

      mostrarAviso(`Bienvenido, ${usuario}`);
      mostrarPantalla('inicio');
    });

    // ==================== REGISTRO ====================
    document.getElementById('btnRegistro').addEventListener('click', () => {
      const usuario = document.getElementById('regUsuario').value.trim();
      const contrasena = document.getElementById('regContrasena').value.trim();

      if (!usuario || !contrasena) {
        mostrarAviso('Completa todos los campos');
        return;
      }

      mostrarAviso('Cuenta creada');
      mostrarPantalla('foto');
    });

    // ==================== FOTO DE PERFIL ====================
    const zonaFoto = document.getElementById('zonaFoto');
    const inputFoto = document.getElementById('inputFoto');
    const previewFoto = document.getElementById('previewFoto');
    const iconoFoto = document.getElementById('iconoFoto');
    const fotoNavbar = document.getElementById('fotoNavbar');

    zonaFoto.addEventListener('click', () => inputFoto.click());

    inputFoto.addEventListener('change', () => {
      const archivo = inputFoto.files[0];
      if (!archivo) return;

      const lector = new FileReader();
      lector.onload = (e) => {
        const url = e.target.result;
        previewFoto.src = url;
        previewFoto.style.display = 'block';
        iconoFoto.style.display = 'none';
        fotoNavbar.src = url;
      };
      lector.readAsDataURL(archivo);
    });

    document.getElementById('btnContinuar').addEventListener('click', () => {
      mostrarPantalla('inicio');
    });

    // ==================== SELECTOR DE IDIOMA ====================
    const btnIdioma = document.getElementById('btnIdioma');
    const textos = {
      es: { idioma: '🌐 ESPAÑOL', login: 'Iniciar sesión' },
      en: { idioma: '🌐 ENGLISH', login: 'Log in' }
    };
    let idiomaActual = 'es';

    btnIdioma.addEventListener('click', () => {
      idiomaActual = idiomaActual === 'es' ? 'en' : 'es';
      btnIdioma.textContent = textos[idiomaActual].idioma;
      mostrarAviso(idiomaActual === 'es' ? 'Idioma: Español' : 'Language: English');
    });

    // ==================== CARRITO ====================
    let carrito = [];

    const contadorCarrito = document.getElementById('contadorCarrito');
    const aviso = document.getElementById('aviso');

    function actualizarContador() {
      const total = carrito.reduce((suma, item) => suma + item.cantidad, 0);
      contadorCarrito.textContent = total;
    }

    let tiempoAviso = null;

    function mostrarAviso(mensaje) {
      aviso.textContent = mensaje;
      aviso.classList.add('aviso--visible');

      clearTimeout(tiempoAviso);
      tiempoAviso = setTimeout(() => {
        aviso.classList.remove('aviso--visible');
      }, 2000);
    }

    function agregarAlCarrito(id, nombre, precio, cantidad) {
      // Si la cantidad es 0, no se agrega nada
      if (cantidad <= 0) {
        mostrarAviso('Selecciona una cantidad mayor a 0');
        return;
      }

      const existente = carrito.find(item => item.id === id);

      if (existente) {
        // Si ya existe, se acumula la cantidad
        existente.cantidad += cantidad;
      } else {
        carrito.push({ id, nombre, precio, cantidad });
      }

      actualizarContador();
      mostrarAviso(`${nombre} agregado al carrito (${cantidad})`);
    }

    // ==================== EVENTOS DE LAS TARJETAS ====================
    document.querySelectorAll('.tarjeta').forEach(tarjeta => {
      const id = Number(tarjeta.dataset.id);
      const nombre = tarjeta.dataset.nombre;
      const precio = Number(tarjeta.dataset.precio);

      const valorCantidad = tarjeta.querySelector('.cantidad__valor');
      const btnMenos = tarjeta.querySelector('.cantidad__menos');
      const btnMas = tarjeta.querySelector('.cantidad__mas');
      const btnComprar = tarjeta.querySelector('.btn-comprar');

      btnMas.addEventListener('click', () => {
        valorCantidad.textContent = Number(valorCantidad.textContent) + 1;
      });

      btnMenos.addEventListener('click', () => {
        const actual = Number(valorCantidad.textContent);
        if (actual > 0) valorCantidad.textContent = actual - 1;
      });

      btnComprar.addEventListener('click', () => {
        const cantidad = Number(valorCantidad.textContent);
        agregarAlCarrito(id, nombre, precio, cantidad);

        if (cantidad > 0) valorCantidad.textContent = 0;
      });
    });
  </script>
</body>
</html>
