<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakinakuy</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f3e8cc;
        font-family: Georgia, serif;
      }

      /* FORMULARIO DE REGISTRO */

      .contenedor {
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }

      .formulario {
        width: 80%;
        max-width: 475px;
      }

      .formulario h2 {
        color: #14532d;
      }

      .campo {
        margin-bottom: 18px;
      }

      .campo label {
        display: block;
        margin-bottom: 8px;
      }

      .campo input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        border: 1px solid #aaa;
        border-radius: 9px;
        font-family: Georgia, serif;
      }

      /* R-06: MENSAJE DE ERROR */

      .mensaje-error {
        color: red;
        font-size: 14px;
        margin-top: 5px;
      }

      /* BOTON REGISTRARSE */

      .boton-login {
        width: 100%;
        height: 40px;
        background-color: #14532d;
        color: white;
        border: none;
        border-radius: 9px;
        font-family: Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .boton-login:hover {
        background-color: gray;
      }

      /* PRODUCTOS POPULARES */

      .productos-populares {
        background-color: #f3e8cc;
        padding: 50px 20px;
        text-align: center;
      }

      .productos-populares h2 {
        font-family: Georgia, serif;
        font-size: 48px;
        font-weight: bold;
        color: #4e7051;
        margin: 0;
      }

      /* DISTRIBUCION DE PRODUCTOS */

      .lista-productos {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        max-width: 932px;
        margin: 50px auto 0;
      }

      /* TARJETAS DE PRODUCTOS */

      .tarjeta-producto {
        background-color: white;
        border-radius: 25px;
        padding: 16px;
        text-align: left;
        min-width: 0;
      }

      /* IMAGENES */

      .tarjeta-producto img {
        display: block;
        width: 100%;
        height: 95px;
        object-fit: cover;
        border-radius: 10px;
      }

      /* NOMBRE DEL PRODUCTO */

      .tarjeta-producto h3 {
        color: #285637;
        font-family: Georgia, serif;
        font-size: 19px;
        margin: 8px 0 5px;
      }

      /* PRODUCTOR Y PRECIO */

      .info-producto {
        background-color: #52765b;
        color: white;
        border-radius: 9px;
        padding: 12px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: bold;
      }

      .info-producto span {
        white-space: nowrap;
      }

      /* CONTROLES DE CANTIDAD */

      .controles-compra {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 5px;
        margin-top: 10px;
      }

      .cantidad {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .numero-cantidad {
        font-size: 26px;
        font-weight: bold;
        color: black;
        min-width: 18px;
        text-align: center;
      }

      /* BOTONES DE CANTIDAD */

      .boton-cantidad {
        background-color: #f5c542;
        color: #285637;
        border: none;
        border-radius: 10px;
        width: 25px;
        height: 38px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
      }

      .boton-cantidad:hover {
        background-color: #cccccc;
      }

      /* BOTON COMPRAR */

      .boton-comprar {
        background-color: #285637;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 8px;
        font-family: Georgia, serif;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      /* HOVER VERDE A GRIS */

      .boton-comprar:hover {
        background-color: gray;
      }

      /* DISEÑO RESPONSIVE */

      @media (max-width: 800px) {
        .lista-productos {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        .productos-populares h2 {
          font-size: 32px;
        }
      }

      @media (max-width: 480px) {
        .lista-productos {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <!-- R-06: REGISTRO Y MANEJO DE ERRORES -->

    <div class="contenedor">
      <form class="formulario" id="formRegistro">
        <h2>Registro de usuario</h2>

        <div class="campo">
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" required />
          <p id="errorUsuario" class="mensaje-error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required />
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" required />
        </div>

        <button type="submit" class="boton-login">Registrarse</button>
      </form>
    </div>

    <!-- PRODUCTOS POPULARES -->

    <section class="productos-populares">
      <h2>Productos Populares</h2>

      <div class="lista-productos">
        <!-- MANZANA -->

        <div class="tarjeta-producto">
          <img
            src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400"
            alt="Manzana"
          />

          <h3>Manzana</h3>

          <div class="info-producto">
            <span>GRANJA RAMIREZ</span>
            <span>4 Bs</span>
          </div>

          <div class="controles-compra">
            <div class="cantidad">
              <button type="button" class="boton-cantidad sumar">+</button>
              <span class="numero-cantidad">0</span>
              <button type="button" class="boton-cantidad restar">−</button>
            </div>

            <button type="button" class="boton-comprar">Comprar</button>
          </div>
        </div>

        <!-- BANANA -->

        <div class="tarjeta-producto">
          <img
            src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400"
            alt="Banana"
          />

          <h3>Banana</h3>

          <div class="info-producto">
            <span>GRANJA RAMIREZ</span>
            <span>4 Bs</span>
          </div>

          <div class="controles-compra">
            <div class="cantidad">
              <button type="button" class="boton-cantidad sumar">+</button>
              <span class="numero-cantidad">0</span>
              <button type="button" class="boton-cantidad restar">−</button>
            </div>

            <button type="button" class="boton-comprar">Comprar</button>
          </div>
        </div>

        <!-- NARANJA -->

        <div class="tarjeta-producto">
          <img
            src="https://images.unsplash.com/photo-1547514701-42782101795e?w=400"
            alt="Naranja"
          />

          <h3>Naranja</h3>

          <div class="info-producto">
            <span>GRANJA RAMIREZ</span>
            <span>4 Bs</span>
          </div>

          <div class="controles-compra">
            <div class="cantidad">
              <button type="button" class="boton-cantidad sumar">+</button>
              <span class="numero-cantidad">0</span>
              <button type="button" class="boton-cantidad restar">−</button>
            </div>

            <button type="button" class="boton-comprar">Comprar</button>
          </div>
        </div>

        <!-- LIMON -->

        <div class="tarjeta-producto">
          <img
            src="https://images.unsplash.com/photo-1590502593747-42a996133562?w=400"
            alt="Limón"
          />

          <h3>Limón</h3>

          <div class="info-producto">
            <span>GRANJA RAMIREZ</span>
            <span>4 Bs</span>
          </div>

          <div class="controles-compra">
            <div class="cantidad">
              <button type="button" class="boton-cantidad sumar">+</button>
              <span class="numero-cantidad">0</span>
              <button type="button" class="boton-cantidad restar">−</button>
            </div>

            <button type="button" class="boton-comprar">Comprar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- JAVASCRIPT -->

    <script>
      /* R-06: MANEJO DE ERRORES */

      const usuariosExistentes = ["admin", "tatiana", "juan"];

      const formulario = document.getElementById("formRegistro");
      const usuario = document.getElementById("usuario");
      const errorUsuario = document.getElementById("errorUsuario");

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();

        const nombre = usuario.value.trim().toLowerCase();

        if (usuariosExistentes.includes(nombre)) {
          errorUsuario.textContent =
            "Este nombre de usuario ya existe. Elige otro.";
        } else {
          errorUsuario.textContent = "";
        }

        // Mantiene los datos de los demás campos.
      });

      /* CONTROLES DE CANTIDAD */

      const tarjetas = document.querySelectorAll(".tarjeta-producto");

      tarjetas.forEach(function (tarjeta) {
        const botonSumar = tarjeta.querySelector(".sumar");
        const botonRestar = tarjeta.querySelector(".restar");
        const numeroCantidad = tarjeta.querySelector(".numero-cantidad");

        let cantidad = 0;

        // Aumentar cantidad
        botonSumar.addEventListener("click", function () {
          cantidad = cantidad + 1;
          numeroCantidad.textContent = cantidad;
        });

        // Disminuir cantidad sin bajar de cero
        botonRestar.addEventListener("click", function () {
          if (cantidad > 0) {
            cantidad = cantidad - 1;
            numeroCantidad.textContent = cantidad;
          }
        });
      });
    </script>
  </body>
</html>
