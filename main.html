<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakinakuy</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f3e8cc;
        font-family: Georgia, serif;
      }

      /* FORMULARIO DE REGISTRO */

      .contenedor {
        display: flex;
        justify-content: center;
        padding: 40px 16px;
      }

      .formulario {
        width: 80%;
        max-width: 475px;
      }

      .formulario h2 {
        color: #14532d;
      }

      .campo {
        margin-bottom: 18px;
      }

      .campo label {
        display: block;
        margin-bottom: 8px;
      }

      .campo input {
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        border: 1px solid #aaa;
        border-radius: 9px;
        font-family: Georgia, serif;
      }

      /* R-06: MENSAJE DE ERROR */

      .mensaje-error {
        color: red;
        font-size: 14px;
        margin-top: 5px;
      }

      .boton-login {
        width: 100%;
        height: 40px;
        background-color: #14532d;
        color: white;
        border: none;
        border-radius: 9px;
        font-family: Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
      }

      .boton-login:hover {
        background-color: #0f4022;
      }

      /* NUEVA TAREA: PRODUCTOS POPULARES */

      .productos-populares {
        background-color: #f3e8cc;
        padding: 50px 20px;
        text-align: center;
      }

      .productos-populares h2 {
        font-family: Georgia, serif;
        font-size: 48px;
        font-weight: bold;
        color: #4e7051;
        margin: 0;
      }

      @media (max-width: 600px) {
        .productos-populares h2 {
          font-size: 32px;
        }
      }
    </style>
  </head>

  <body>
    <!-- R-06: REGISTRO Y MANEJO DE ERRORES -->

    <div class="contenedor">
      <form class="formulario" id="formRegistro">
        <h2>Registro de usuario</h2>

        <div class="campo">
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" required />
          <p id="errorUsuario" class="mensaje-error" role="alert"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required />
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" required />
        </div>

        <button type="submit" class="boton-login">Registrarse</button>
      </form>
    </div>

    <!-- NUEVA TAREA: PRODUCTOS POPULARES -->

    <section class="productos-populares">
      <h2>Productos Populares</h2>
    </section>

    <!-- JAVASCRIPT R-06 -->

    <script>
      // Usuarios de ejemplo para probar el manejo de errores
      const usuariosExistentes = ["admin", "tatiana", "juan"];

      const formulario = document.getElementById("formRegistro");
      const usuario = document.getElementById("usuario");
      const errorUsuario = document.getElementById("errorUsuario");

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();

        const nombre = usuario.value.trim().toLowerCase();

        if (usuariosExistentes.includes(nombre)) {
          errorUsuario.textContent =
            "Este nombre de usuario ya existe. Elige otro.";
        } else {
          errorUsuario.textContent = "";
        }

        // Mantiene los datos de los demás campos.
        // No se reinicia el formulario.
      });
    </script>
  </body>
</html>
