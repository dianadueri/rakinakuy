<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listado de Recetas - Rakinakuy</title>

    <style>
      body {
        margin: 0;
        background-color: #f3e8cc;
        font-family: Georgia, serif;
        text-align: center;
        padding: 40px 20px;
      }

      h1 {
        color: #4e7051;
        font-size: 48px;
      }

      .lista-recetas {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
      }

      .tarjeta {
        background-color: white;
        width: 300px;
        padding: 20px;
        border-radius: 20px;
      }

      .tarjeta img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 15px;
      }

      .tarjeta h2 {
        color: #285637;
      }

      button {
        background-color: #285637;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 30px;
        font-family: Georgia, serif;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background-color: gray;
      }

      .boton-volver {
        margin-top: 40px;
      }
    </style>
  </head>

  <body>
    <h1>Todas las Recetas</h1>

    <div class="lista-recetas">
      <div class="tarjeta">
        <img
          src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800"
          alt="Ensalada de huerto"
        />

        <h2>Ensalada de huerto</h2>

        <button onclick="window.location.href = 'receta-huerto.html'">
          Ver receta
        </button>
      </div>

      <div class="tarjeta">
        <img
          src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=800"
          alt="Ensalada Primavera"
        />

        <h2>Ensalada Primavera</h2>

        <button onclick="window.location.href = 'receta-primavera.html'">
          Ver receta
        </button>
      </div>
    </div>

    <button
      class="boton-volver"
      onclick="window.location.href = 'main.html#recetas'"
    >
      Volver
    </button>
  </body>
</html>
